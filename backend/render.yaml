services:
  - type: web
    name: parental-guard-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: frankfurt
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_BOT_TOKEN
        sync: false
      - key: TUTOR_RATE_LIMIT
        value: "20"
      - key: TUTOR_RATE_WINDOW_SEC
        value: "60"
