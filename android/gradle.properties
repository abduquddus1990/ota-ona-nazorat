# AndroidX majburiy: loyihadagi barcha kutubxonalar (core-ktx, work, security)
# AndroidX'da. Bu bayroqsiz build "This project uses AndroidX dependencies,
# but the 'android.useAndroidX' property is not enabled" xatosi bilan to'xtaydi.
android.useAndroidX=true

# R sinflari modullar orasida takrorlanmaydi — build tezroq va yengilroq.
android.nonTransitiveRClass=true

# Kotlin va Gradle uchun xotira. Kamroq berilsa katta build'da
# "Out of memory" chiqishi mumkin.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Faqat o'zgargan qismlarni qayta yig'adi — takroriy build'lar ancha tez.
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
