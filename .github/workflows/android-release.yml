# Google Play uchun imzolangan AAB (qo'lda ishga tushiriladi).
#
# Actions -> "Android Play AAB" -> "Run workflow". Tugagach, sahifaning
# pastidagi "Artifacts" bo'limidan qalqon-play-aab ni yuklab oling (zip),
# ichidagi .aab faylni Play Console'ga yuklang.
#
# Sekretlar (Settings -> Secrets and variables -> Actions):
#   QALQON_UPLOAD_KEY_B64      — yuklash kalitining base64 matni
#   QALQON_UPLOAD_KEY_PASSWORD — uning paroli
# Kalitning o'zi faqat egasining kompyuterida (qalqon-maxfiy) — repoda yo'q.
#
# Har yuklashdan oldin android/app/build.gradle.kts dagi versionCode
# oshirilgan bo'lishi shart (Play bir xil raqamni qabul qilmaydi).
name: Android Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Animatsiya nusxasini tekshirish
        run: python3 tools/sync_android_splash.py --check

      - name: Sekretlar bormi
        env:
          KEY_B64: ${{ secrets.QALQON_UPLOAD_KEY_B64 }}
          KEY_PW: ${{ secrets.QALQON_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PW" ]; then
            echo "::error::QALQON_UPLOAD_KEY_B64 yoki QALQON_UPLOAD_KEY_PASSWORD sekreti qo'shilmagan."
            exit 1
          fi

      - name: Kalitni joylash (faqat shu yig'ish uchun)
        working-directory: android
        env:
          KEY_B64: ${{ secrets.QALQON_UPLOAD_KEY_B64 }}
          KEY_PW: ${{ secrets.QALQON_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 -d > qalqon-upload.p12
          {
            echo "storeFile=qalqon-upload.p12"
            echo "storeType=pkcs12"
            echo "storePassword=$KEY_PW"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PW"
          } > keystore.properties

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Imzolangan AAB yig'ish
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace bundleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Log tashqaridan o'qilmaydi (403) — xato matni annotatsiya bo'lib chiqadi.
      - name: Xato matnini ko'rsatish
        if: failure()
        run: |
          grep -nE "^e: |error:|ERROR:|Missing class|R8|FAILURE|What went wrong|Caused by|Could not|> Task .* FAILED" build.log | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 25 build.log | while IFS= read -r line; do echo "::error::TAIL $line"; done

      - name: Kalitni o'chirish
        if: always()
        working-directory: android
        run: rm -f qalqon-upload.p12 keystore.properties

      - name: AAB'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: qalqon-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
