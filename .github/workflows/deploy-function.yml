# Serverni (ota-ona-bot Edge Function) main'ga merge bo'lganda deploy qiladi.
#
# Nega kerak: foydalanuvchi ko'pincha telefondan ishlaydi. Agent bulutda PR
# ochadi, u GitHub ilovasida "Merge" ni bosadi — va server shu bilan
# yangilanadi. Merge tugmasi jonli tizimga chiqarishning yagona darvozasi:
# agentning o'zi deploy qila olmaydi.
#
# Sekret: repo Settings → Secrets and variables → Actions →
# SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
#
# Baza migratsiyalari bu yerda qo'llanmaydi — ular qaytarib bo'lmaydigan
# o'zgarish, shuning uchun alohida, foydalanuvchi ruxsati bilan.
name: Deploy ota-ona-bot

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-function.yml"
  workflow_dispatch:

concurrency:
  group: deploy-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wfrclcwjeeqeqchmdhzw
    steps:
      - uses: actions/checkout@v4

      - name: Sekret bormi
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN sekreti qo'shilmagan — deploy qilinmadi."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt majburiy: Telegram webhook JWT yubormaydi, usiz bot
      # har bir xabarga 401 qaytarib, butunlay jim qoladi.
      - name: Deploy
        run: supabase functions deploy ota-ona-bot --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      # Deploy "muvaffaqiyatli" deyilishi funksiya ishlayapti degani emas.
      # Autentifikatsiyasiz so'rovga 401 qaytsa — funksiya ko'tarilgan va
      # o'z kodimiz javob beryapti (500 yoki 404 bo'lsa — buzilgan).
      - name: Funksiya javob beryaptimi
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/ota-ona-bot" \
            -H "Content-Type: application/json" -d '{"type":"coparent_list"}')
          echo "HTTP $code"
          if [ "$code" != "401" ]; then
            echo "::error::Kutilgan 401 o'rniga $code — funksiya ishlamayapti bo'lishi mumkin."
            exit 1
          fi
