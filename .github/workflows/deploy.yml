name: Deploy Telegram Mini App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Tailwind CSS chiqarishdan oldin har safar qayta yig'iladi
      # (tools/tailwind/build.sh): yangi klass qo'shilib, yig'ish unutilgan
      # bo'lsa ham saytda uslub yo'qolmaydi.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tailwind CSS
        run: bash tools/tailwind/build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'telegram_miniapp'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
