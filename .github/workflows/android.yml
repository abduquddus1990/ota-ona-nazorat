# Android ilovani GitHub'ning o'zida yig'adi.
#
# Nega kerak: ishlab chiqish kompyuterida Java ham, Android SDK ham yo'q,
# ya'ni kodni yozib, uni yig'ib ko'rmasdan berib bo'lmaydi. Bu oqim har
# push'da ilovani yig'adi va o'rnatiladigan APK'ni artifact qilib qoldiradi:
# xato bo'lsa darhol ko'rinadi, tayyor bo'lsa telefonga o'rnatib sinash mumkin.
name: Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # PR'lar ham yig'iladi. Ilgari faqat main'ga push'da ishlardi — ya'ni
  # Kotlin kodidagi kompilyatsiya xatosi FAQAT merge qilingandan keyin
  # ko'rinardi, va tuzatish uchun yana bitta PR kerak bo'lardi. Bu amalda
  # bir necha marta sodir bo'lgan.
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repoda gradle-wrapper.jar yo'q, shuning uchun Gradle'ning o'zi
      # o'rnatiladi (versiya gradle-wrapper.properties dagi bilan bir xil).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Debug APK yig'ish
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Yig'ish logi tashqaridan o'qilmaydi (403), shuning uchun xato matnini
      # annotatsiya qilib chiqaramiz — u ochiq API orqali ko'rinadi.
      - name: Xato matnini ko'rsatish
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|Could not|> Task .* FAILED" build.log | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 25 build.log | while IFS= read -r line; do echo "::error::TAIL $line"; done

      - name: APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: qalqon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK'ni ochiq Release'ga ham qo'yamiz.
      #
      # Nega kerak: artifact'ni yuklab olish uchun GitHub'ga kirish shart,
      # va u ZIP bo'lib tushadi — Android ZIP'ni o'rnatolmaydi. Amalda bu
      # shunday tugadi: APK telefonga ZIP holida yetib bordi va o'rnatilmadi.
      # Release fayli esa oddiy havola: telefon brauzerida ochilsa darhov
      # .apk bo'lib yuklanadi, hisobga kirish ham, arxivni ochish ham
      # kerak emas. Havola doimiy, har yangi yig'ishda yangilanadi:
      #   .../releases/latest/download/qalqon.apk
      - name: Ochiq havolaga qo'yish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" qalqon.apk
          IZOH="Qalqon AI Android ilovasi. Commit: ${GITHUB_SHA:0:7}, yig'ilgan: $(date -u '+%Y-%m-%d %H:%M UTC').

          Telefonda o'rnatish: shu sahifadagi **qalqon.apk** ni bosing, yuklab olingach faylni ochib 'O'rnatish' ni tanlang."
          if gh release view apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload apk qalqon.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit apk --repo "$GITHUB_REPOSITORY" --notes "$IZOH"
          else
            gh release create apk qalqon.apk --repo "$GITHUB_REPOSITORY"               --title "Qalqon AI — Android ilova" --notes "$IZOH" --latest
          fi
