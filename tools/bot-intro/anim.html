<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:640px; height:360px; overflow:hidden; }
  body { font-family:"Nunito",sans-serif; background:radial-gradient(90% 120% at 65% 10%, #ffffff 0%, #e4f1fb 45%, #b9d8ee 100%); position:relative; }
  :root { --d:6s; }
  .anim { animation-duration:var(--d); animation-timing-function:linear; animation-fill-mode:both; animation-iteration-count:1; }

  /* 1) Shahar sxemasi: 0–0.6 s paydo bo'ladi, 4.3 s dan so'nadi */
  .map { position:absolute; inset:0; animation-name:map; }
  @keyframes map { 0%{opacity:0;transform:scale(1.04)} 10%{opacity:1;transform:scale(1)} 70%{opacity:1;filter:none} 80%{opacity:.18;filter:blur(2px)} 100%{opacity:.18;filter:blur(2px)} }
  .map svg { width:100%; height:100%; }

  /* Yo'l chizig'i 0.5–2.4 s chiziladi */
  .route { stroke-dasharray:420; stroke-dashoffset:420; animation-name:route; }
  @keyframes route { 0%,8%{stroke-dashoffset:420} 40%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }

  /* Farzand nuqtasi yo'l bo'ylab */
  .dot { }
 100%{offset-distance:100%} }
  .halo { animation-name:halo; transform-origin:center; transform-box:fill-box; }
  @keyframes halo { 0%{opacity:.6;transform:scale(.6)} 5%{opacity:0;transform:scale(1.8)} 5.01%{opacity:.6;transform:scale(.6)} 10%{opacity:0;transform:scale(1.8)} 10.01%{opacity:.6;transform:scale(.6)} 15%{opacity:0;transform:scale(1.8)} 15.01%{opacity:.6;transform:scale(.6)} 20%{opacity:0;transform:scale(1.8)} 20.01%{opacity:.6;transform:scale(.6)} 25%{opacity:0;transform:scale(1.8)} 25.01%{opacity:.6;transform:scale(.6)} 30%{opacity:0;transform:scale(1.8)} 30.01%{opacity:.6;transform:scale(.6)} 35%{opacity:0;transform:scale(1.8)} 35.01%{opacity:.6;transform:scale(.6)} 40%{opacity:0;transform:scale(1.8)} 100%{opacity:0} }

  /* 2) Maktab hududi va qalqon: 2.4–3.3 s */
  .zone { transform-origin:470px 118px; animation-name:zone; }
  @keyframes zone { 0%,38%{opacity:0;transform:scale(.4)} 46%{opacity:1;transform:scale(1.06)} 50%{opacity:1;transform:scale(1)} 100%{opacity:1} }
  .shield { transform-origin:470px 110px; animation-name:shield; }
  @keyframes shield { 0%,42%{opacity:0;transform:scale(.3) translateY(10px)} 52%{opacity:1;transform:scale(1.12)} 56%{opacity:1;transform:scale(1)} 100%{opacity:1} }

  /* 3) Xabar kartasi: 3.2–4.3 s yuqoridan tushadi */
  .note { position:absolute; left:50%; top:26px; width:300px; transform:translateX(-50%); background:#fff; border-radius:18px;
    box-shadow:0 18px 40px -12px rgba(15,42,74,.35); display:flex; align-items:center; gap:12px; padding:12px 14px; animation-name:note; }
  @keyframes note { 0%,53%{opacity:0;transform:translate(-50%,-60px)} 60%{opacity:1;transform:translate(-50%,6px)} 63%{transform:translate(-50%,0)} 72%{opacity:1;transform:translate(-50%,0)} 78%{opacity:0;transform:translate(-50%,-20px)} 100%{opacity:0} }
  .note i { font-style:normal; width:42px; height:42px; border-radius:13px; background:#e6f6ec; display:grid; place-items:center; font-size:22px; flex:none; }
  .note b { display:block; color:#0f2a4a; font-size:17px; font-weight:900; line-height:1.15; }
  .note small { color:#5b6b80; font-size:13px; font-weight:700; }
  .app { color:#1d6fe0; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }

  /* 4) Bo'ri va va'da: 4.4–6 s */
  .wolf { position:absolute; right:56px; bottom:-14px; height:330px; animation-name:wolf; filter:drop-shadow(0 18px 24px rgba(15,42,74,.3)); }
  @keyframes wolf { 0%,72%{opacity:0;transform:translateY(40px) scale(.96)} 82%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:1;transform:none} }
  .brand { position:absolute; left:48px; top:96px; width:330px; animation-name:brand; }
  @keyframes brand { 0%,76%{opacity:0;transform:translateX(-20px)} 86%{opacity:1;transform:none} 100%{opacity:1} }
  .brand .logo { display:flex; align-items:center; gap:10px; color:#0f2a4a; font-weight:900; font-size:30px; }
  .brand .logo span { width:42px; height:42px; border-radius:12px; background:#0f2a4a; display:grid; place-items:center; color:#fff; font-size:22px; }
  .brand h1 { margin-top:14px; color:#0f2a4a; font-size:26px; line-height:1.15; font-weight:900; }
  .brand h1 em { font-style:normal; color:#1d6fe0; }
  .brand p { margin-top:12px; display:inline-block; background:#0f2a4a; color:#fff; font-weight:900; font-size:14px; padding:9px 14px; border-radius:12px; }
</style></head>
<body>
  <div class="map anim">
    <svg viewBox="0 0 640 360">
      <g fill="#dbe8f4">
        <rect x="20" y="20" width="120" height="80" rx="12"/><rect x="160" y="20" width="150" height="80" rx="12"/><rect x="330" y="20" width="90" height="60" rx="12"/>
        <rect x="20" y="120" width="120" height="100" rx="12"/><rect x="160" y="250" width="120" height="90" rx="12"/><rect x="520" y="200" width="100" height="140" rx="12"/>
        <rect x="300" y="250" width="200" height="90" rx="12"/><rect x="540" y="20" width="80" height="150" rx="12"/>
      </g>
      <g stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round">
        <path d="M0 236 H640"/><path d="M150 0 V360"/><path d="M320 0 V360"/><path d="M0 110 H640"/><path d="M510 0 V360"/>
      </g>
      <!-- Uy -->
      <circle cx="95" cy="285" r="26" fill="#1d6fe022"/>
      <text x="95" y="292" font-size="22" text-anchor="middle">🏠</text>
      <path class="route anim" d="M95 285 C 150 280, 170 230, 230 215 S 330 200, 360 160 S 430 120, 470 118" stroke="#22b8e6" stroke-width="4" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
      <!-- Maktab hududi -->
      <g class="zone anim">
        <circle cx="470" cy="118" r="62" fill="#22b8e633" stroke="#22b8e6" stroke-width="2.5" stroke-dasharray="7 7"/>
      </g>
      <g class="shield anim">
        <path d="M470 76 l34 13 v22 c0 21 -15 34 -34 42 c-19 -8 -34 -21 -34 -42 v-22 z" fill="#1d6fe0" fill-opacity=".16" stroke="#1d6fe0" stroke-width="3"/>
        <text x="470" y="121" font-size="24" text-anchor="middle">🏫</text>
      </g>
      <g class="dot anim">
        <circle class="halo anim" r="11" fill="#1d6fe0"/>
        <circle r="9" fill="#1d6fe0" stroke="#fff" stroke-width="4"/>
      </g>
    </svg>
  </div>

  <div class="note anim"><i>🏫</i><div><div class="app">Qalqon AI</div><b>Maktabga yetdi</b><small>Madina · 08:05</small></div></div>

  <img class="wolf anim" src="wolf_guardian.png" alt="">
  <div class="brand anim">
    <div class="logo"><span>🛡</span>Qalqon AI</div>
    <h1>Farzandingiz xavfsiz —<br><em>siz xotirjam.</em></h1>
    <p>▶ Start ni bosing</p>
  </div>
</body></html>
